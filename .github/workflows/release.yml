name: Release

on:
  push:
    branches:
      - feature/support-cd

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get project version
        id: project_version
        run: echo "value=$(npm run project:version --silent)" >> $GITHUB_OUTPUT

      - name: Get project version
        id: project_name
        run: echo "value=$(npm run project:name --silent)" >> $GITHUB_OUTPUT

      - name: Build project
        run: npm run build

      - name: Archive dist
        run: zip -r ${{ steps.project_name.output.value }}-v${{ steps.project_version.outputs.value }}.zip dist/

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          tag: ${{ steps.project_version.outputs.value }}
          name: "v${{ steps.project_version.outputs.value }}"
          artifacts: "${{ steps.project_name.output.value }}-v${{ steps.project_version.outputs.value }}.zip"
