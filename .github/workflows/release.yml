name: Release

on:
  push:
    branches:
      - release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get project version
        id: project_version
        run: echo "value=$(npm run project:version --silent)" >> $GITHUB_OUTPUT

      - name: Get project name
        id: project_name
        run: echo "value=$(npm run project:name --silent)" >> $GITHUB_OUTPUT

      - name: Build project
        run: npm run build

      - name: Archive dist
        run: |
          cd dist
          zip -r ../landing-editor.zip .

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          tag: ${{ steps.project_version.outputs.value }}
          name: "v${{ steps.project_version.outputs.value }}"
          artifacts: landing-editor.zip

  docker-image:
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get project version
        id: project_version
        run: echo "value=$(npm run project:version --silent)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/landing-editor:${{ steps.project_version.outputs.value }}
